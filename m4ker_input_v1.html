<!DOCTYPE html>
<!--
    m4ker 입력 페이지
    제품 사진 + 프롬프트 + 예시 스타일 (검색창형 배치)
-->
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M4KER · 만들기</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
    <link rel="stylesheet" href="./css/m4ker_style.css">

    <!-- 입력 페이지 전용 스타일 (공통 스타일은 ./css/m4ker_style.css) -->
    <style>
    body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: linear-gradient(165deg, #f1ecfd 0%, #ebe5fb 55%, var(--mist-deep) 100%);
    }

    /* =========================================================
       배경: 시작 화면(.hero-bg)과 같은 색 덩어리
       스크롤해도 따라오도록 화면에 고정
       ========================================================= */
    .page-bg {
        position: fixed;
        inset: 0;
        z-index: 0;
        overflow: hidden;
        pointer-events: none;
    }

    .blob {
        position: absolute;
        border-radius: 50%;
        filter: blur(70px);
        opacity: 0.85;
        animation: drift 22s ease-in-out infinite alternate;
    }

    .blob-1 {
        width: 52vw; height: 52vw;
        top: -18vw; right: -10vw;
        background: var(--haze);
    }

    .blob-2 {
        width: 48vw; height: 48vw;
        bottom: -20vw; left: -12vw;
        background: var(--periwinkle);
        animation-duration: 26s;
        animation-delay: -6s;
    }

    .blob-3 {
        width: 36vw; height: 36vw;
        top: 20%; left: 18%;
        background: var(--lilac);
        animation-duration: 30s;
        animation-delay: -12s;
    }

    .blob-4 {
        width: 40vw; height: 26vw;
        top: 30%; left: 30%;
        background: rgba(255, 255, 255, 0.85);
        filter: blur(90px);
        animation-duration: 34s;
    }

    @keyframes drift {
        0%   { transform: translate(0, 0) scale(1); }
        50%  { transform: translate(4vw, 3vh) scale(1.08); }
        100% { transform: translate(-3vw, -2vh) scale(0.96); }
    }

    .hero-nav,
    .make,
    .site-foot {
        position: relative;
        z-index: 1;
    }

    .site-foot {
        justify-content: center;
        background: transparent;
    }

    /* =========================================================
       본문
       ========================================================= */
    .make {
        flex: 1;
        width: 100%;
        max-width: 1160px;
        margin: 0 auto;
        padding: 24px 6vw 120px;
    }

    .make .section-head {
        margin-bottom: 44px;
        animation: riseIn 0.9s var(--ease-out) both;
    }

    /* ---------- 입력 줄: 사진 + 프롬프트 + 생성 버튼 ---------- */
    .search {
        display: grid;
        grid-template-columns: 160px 1fr 150px;
        gap: 16px;
        padding: 16px;
        background: var(--glass-strong);
        border: 1px solid var(--glass-edge);
        border-radius: 26px;
        box-shadow: var(--shadow-lift), 0 0 0 1px var(--line-faint);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        animation: riseIn 0.9s var(--ease-out) 0.12s both;
    }

    .drop {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 6px;
        aspect-ratio: 1;
        border: 1.5px dashed rgba(90, 63, 216, 0.4);
        border-radius: 16px;
        background: rgba(244, 241, 253, 0.85);
        text-align: center;
        cursor: pointer;
        overflow: hidden;
        transition: background-color 0.2s, border-color 0.2s;
    }

    .drop:hover,
    .drop.is-dragover {
        background: #ece6fb;
        border-color: var(--iris);
    }

    .drop input {
        position: absolute;
        width: 1px;
        height: 1px;
        opacity: 0;
    }

    .drop:focus-within {
        outline: 3px solid var(--iris);
        outline-offset: 3px;
    }

    .drop-icon {
        width: 30px;
        height: 30px;
        color: var(--iris);
    }

    .drop-main {
        font-size: 14px;
        font-weight: 700;
    }

    .drop-sub {
        font-size: 12px;
        color: var(--ink-faint);
    }

    .drop img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: contain;
        background: #ffffff;
    }

    .drop.has-image .drop-icon,
    .drop.has-image .drop-main,
    .drop.has-image .drop-sub {
        visibility: hidden;
    }

    .prompt-box {
        position: relative;
    }

    .prompt-box textarea {
        display: block;
        width: 100%;
        height: 100%;
        min-height: 128px;
        padding: 18px 20px 34px;
        border: 1px solid transparent;
        border-radius: 16px;
        background: var(--mist);
        font: inherit;
        font-size: 17px;
        line-height: 1.6;
        color: var(--ink);
        resize: none;
        transition: border-color 0.2s, background-color 0.2s;
    }

    .prompt-box textarea::placeholder {
        color: var(--ink-faint);
    }

    .prompt-box textarea:focus {
        outline: none;
        border-color: var(--iris);
        background: #ffffff;
    }

    .prompt-count {
        position: absolute;
        right: 16px;
        bottom: 12px;
        font-size: 12px;
        color: var(--ink-faint);
        font-variant-numeric: tabular-nums;
    }

    .search .btn {
        height: 100%;
        padding: 0 20px;
        border-radius: 18px;
        font-size: 16px;
    }

    .btn:disabled {
        background: #cfc6ee;
        box-shadow: none;
        transform: none;
        cursor: not-allowed;
    }

    /* 입력 줄 아래 안내 줄 */
    .search-meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        min-height: 24px;
        margin-top: 14px;
        padding: 0 8px;
        font-size: 13px;
        color: var(--ink-soft);
    }

    .file-row {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 0;
    }

    .file-row[hidden] {
        display: none;
    }

    .file-name {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .text-btn {
        flex-shrink: 0;
        border: 0;
        background: none;
        font: inherit;
        font-weight: 700;
        color: var(--iris);
        cursor: pointer;
    }

    .make-status {
        margin-left: auto;
        text-align: right;
    }

    /* ---------- 예시 스타일 ---------- */
    .gallery {
        margin-top: 48px;
        animation: riseIn 0.9s var(--ease-out) 0.24s both;
    }

    .gallery-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
    }

    .gallery-title {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: -0.02em;
    }

    .gallery-hint {
        font-size: 13px;
        color: var(--ink-soft);
    }

    .styles {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
    }

    .style-card {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 0;
        border: 0;
        background: none;
        font: inherit;
        color: inherit;
        text-align: left;
        cursor: pointer;
    }

    .style-thumb {
        display: block;
        width: 100%;
        aspect-ratio: 4 / 3;
        margin-bottom: 6px;
        border-radius: 18px;
        object-fit: cover;
        outline: 2px solid transparent;
        outline-offset: 3px;
        box-shadow: 0 18px 36px -24px rgba(60, 40, 150, 0.45);
        transition: transform 0.25s var(--ease-out), outline-color 0.2s;
    }

    .style-card:hover .style-thumb {
        transform: translateY(-4px);
    }

    .style-name {
        font-size: 15px;
        font-weight: 700;
    }

    .style-desc {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        font-size: 12px;
        line-height: 1.5;
        color: var(--ink-faint);
    }

    .style-card.is-selected .style-thumb {
        outline-color: var(--iris);
    }

    .style-card.is-selected .style-name {
        color: var(--iris);
    }

    /* 예시 이미지가 없을 때 쓰는 장면 타일 (시작 페이지 tile-1~4와 같은 색감) */
    .tile-warm {
        background:
            radial-gradient(circle at 72% 22%, rgba(255, 244, 214, 0.95), transparent 42%),
            linear-gradient(180deg, #f6e7d6 0 58%, #e8dccf 58% 100%);
    }

    .tile-green {
        background:
            radial-gradient(circle at 28% 30%, #b7cda6 0 16%, transparent 17%),
            radial-gradient(circle at 40% 22%, #a9c296 0 11%, transparent 12%),
            linear-gradient(180deg, #e0e9d8 0 60%, #c9d6bf 60% 100%);
    }

    .tile-sunset {
        background: linear-gradient(180deg, #f7d3bf 0%, #f0b9a9 58%, #e6d0c5 58% 100%);
    }

    .tile-studio {
        background:
            radial-gradient(ellipse at 50% 100%, rgba(255, 255, 255, 0.6), transparent 60%),
            linear-gradient(180deg, #dcdfe6 0 60%, #c0c5cf 60% 100%);
    }

    .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
    }

    /* =========================================================
       반응형
       ========================================================= */
    @media (max-width: 860px) {
        .search {
            grid-template-columns: 120px 1fr;
        }

        .search .btn {
            grid-column: 1 / -1;
            height: auto;
            padding: 16px;
        }

        .styles {
            grid-template-columns: repeat(2, 1fr);
        }
    }

    @media (max-width: 520px) {
        .search {
            grid-template-columns: 1fr;
        }

        .drop {
            aspect-ratio: 16 / 9;
        }

        .search-meta,
        .gallery-head {
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
        }

        .make-status {
            margin-left: 0;
            text-align: left;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .blob {
            animation: none;
        }
    }
    </style>
</head>
<body>

    <div class="page-bg" aria-hidden="true">
        <span class="blob blob-1"></span>
        <span class="blob blob-2"></span>
        <span class="blob blob-3"></span>
        <span class="blob blob-4"></span>
    </div>

    <nav class="hero-nav" aria-label="주요 메뉴">
        <a class="nav-logo" href="./m4ker_startpage.html">M<span class="m4-four">4</span>KER</a>
        <ul class="nav-links">
            <li><a href="#">로그인</a></li>
        </ul>
    </nav>

    <main class="make">
        <div class="section-head">
            <h1 class="section-title">어떤 광고를 만들까요?</h1>
            <p class="section-sub">제품 사진과 원하는 분위기를 한 줄에 입력하세요.</p>
        </div>

        <form id="makeForm">
            <div class="search">
                <!-- 제품 사진 -->
                <label class="drop" id="drop">
                    <input type="file" id="imageInput" accept="image/*">
                    <svg class="drop-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M12 16V4"/><path d="m7 9 5-5 5 5"/><path d="M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/>
                    </svg>
                    <span class="drop-main">제품 사진</span>
                    <span class="drop-sub">눌러서 선택 · 끌어다 놓기</span>
                    <img id="preview" alt="선택한 제품 사진 미리보기" hidden>
                </label>

                <!-- 프롬프트 -->
                <div class="prompt-box">
                    <label for="prompt" class="sr-only">원하는 광고 분위기</label>
                    <textarea id="prompt" maxlength="300"
                              placeholder="원하는 분위기를 적거나, 아래 예시 스타일을 눌러 보세요.&#10;예) christmas mood, warm lights on a wooden table"></textarea>
                    <span class="prompt-count" id="promptCount">0 / 300</span>
                </div>

                <button class="btn btn-primary" type="submit" id="generateBtn" disabled>생성하기</button>
            </div>

            <div class="search-meta">
                <div class="file-row" id="fileRow" hidden>
                    <span class="file-name" id="fileName"></span>
                    <button class="text-btn" type="button" id="clearImage">다시 선택</button>
                </div>
                <p class="make-status" id="makeStatus" role="status">제품 사진과 프롬프트를 입력하면 생성할 수 있어요.</p>
            </div>
        </form>

        <!-- 예시 스타일 (나중에 이 자리에 검색 결과 Top-5) -->
        <section class="gallery" aria-labelledby="galleryTitle">
            <div class="gallery-head">
                <h2 class="gallery-title" id="galleryTitle">예시 스타일</h2>
                <p class="gallery-hint">하나를 누르면 프롬프트에 추가돼요. 다른 스타일을 누르면 바뀌고, 빼려면 프롬프트에서 지워 주세요.</p>
            </div>

            <div class="styles">
                <button class="style-card" type="button"
                        data-caption="on a warm wooden table, soft morning sunlight, cozy cafe mood">
                    <span class="style-thumb tile-warm" aria-hidden="true"></span>
                    <span class="style-name">따뜻한 카페</span>
                    <span class="style-desc"></span>
                </button>
                <button class="style-card" type="button"
                        data-caption="surrounded by green leaves, fresh natural light, outdoor garden mood">
                    <span class="style-thumb tile-green" aria-hidden="true"></span>
                    <span class="style-name">싱그러운 자연</span>
                    <span class="style-desc"></span>
                </button>
                <button class="style-card" type="button"
                        data-caption="soft pink and orange sunset tones, dreamy warm atmosphere">
                    <span class="style-thumb tile-sunset" aria-hidden="true"></span>
                    <span class="style-name">노을빛 감성</span>
                    <span class="style-desc"></span>
                </button>
                <button class="style-card" type="button"
                        data-caption="clean minimal studio background, soft even lighting, subtle shadow">
                    <span class="style-thumb tile-studio" aria-hidden="true"></span>
                    <span class="style-name">미니멀 스튜디오</span>
                    <span class="style-desc"></span>
                </button>
            </div>
        </section>
    </main>

    <footer class="site-foot">
        <span>BOAZ 미니프로젝트 4조</span>
    </footer>

    <script src="./JS/m4ker_input_v1.js"></script>
</body>
</html>
